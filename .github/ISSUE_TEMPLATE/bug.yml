name: 🐛 Defect Report
description: Report a bug or accessibility failure.
title: "fix: "
labels: ["fix: defect", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction Link
      description: Link to a repo, deployed project, code sample.